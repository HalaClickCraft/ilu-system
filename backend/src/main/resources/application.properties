# ILU System - Application Configuration

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ilu_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ilu_user
spring.datasource.password=ilu123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# JWT
app.jwt.secret=MySuperSecretKeyForILUSystemJwtTokenGenerationThatIsLongEnough2024!
app.jwt.expiration-ms=86400000

# CORS (for development)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

server.error.include-message=always

# Ollama Chatbot Configuration
app.ollama.url=http://localhost:11434
app.ollama.model=llama3