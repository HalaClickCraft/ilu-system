# ILU System - Application Configuration

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/ilu_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=MySuperSecretKeyForILUSystemJwtTokenGenerationThatIsLongEnough2024!
app.jwt.expiration-ms=86400000

# CORS (for development)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
