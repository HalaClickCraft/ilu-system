services:
  mysql:
    image: mysql:8.0
    container_name: ilu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ilu_db
      MYSQL_USER: ilu_user
      MYSQL_PASSWORD: ilu123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ilu-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ilu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data: